<div class="history-container">
  <!-- Header con título y botón Exportar -->
  <div class="header-row">
    <h1>Historial de Alarmas</h1>
    <button
      mat-flat-button
      color="primary"
      class="export-btn"
      (click)="exportar()"
    >
      <mat-icon>file_download</mat-icon> Exportar
    </button>
  </div>

  <!-- Filtros superiores: buscador y Date Range (dummy) -->
  <div class="top-filters">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        placeholder="Buscar alarmas..."
        [(ngModel)]="searchText"
        (ngModelChange)="onSearchChange($event)"
      />
    </mat-form-field>

    <button mat-stroked-button class="date-btn">
      <mat-icon>date_range</mat-icon> Rango de fechas
    </button>
  </div>

  <!-- Toggle de estados -->
  <mat-button-toggle-group
    [(value)]="filtro"
    class="status-toggle"
    (change)="onFiltroChange($event.value)"
  >
    <mat-button-toggle value="all">Todas</mat-button-toggle>
    <mat-button-toggle value="active">Activas</mat-button-toggle>
    <mat-button-toggle value="resolved">Resueltas</mat-button-toggle>
  </mat-button-toggle-group>

  <!-- Subtítulo de la tabla -->
  <h2 class="table-title">Registro de Alarmas</h2>

  <!-- Tabla -->
  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" class="full-width">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let r">#{{ r.id }}</td>
      </ng-container>

      <!-- Dispositivo -->
      <ng-container matColumnDef="deviceName">
        <th mat-header-cell *matHeaderCellDef>Dispositivo</th>
        <td mat-cell *matCellDef="let r">{{ r.deviceName }}</td>
      </ng-container>

      <!-- Nivel -->
      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef>Nivel (μSv/h)</th>
        <td mat-cell *matCellDef="let r">{{ r.level }}</td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">
          {{ r.timestamp | date : "d/MM/yyyy, h:mm:ss a" }}
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span
            class="badge"
            [ngClass]="
              r.status === 'active' ? 'badge-active' : 'badge-resolved'
            "
          >
            {{ r.status === "active" ? "Activa" : "Resuelta" }}
          </span>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let r">
          <button mat-button color="accent">Detalles</button>
        </td>
      </ng-container>

      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <!-- Paginador -->
  <div class="paginator-container">
    <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
  </div>
</div>
